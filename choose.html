<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 Map Pick/Ban Phase</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #141922;
            --text-color: #f3f4f6;
            --team1-color: #de9b35;
            --team2-color: #4b92db;
            --ban-color: #ef4444;
            --pick-color: #10b981;
            --decider-color: #8b5cf6;
            --play-color: #f43f5e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: flex-start;
            position: relative;
        }

        /* Стартовый затемненный экран */
        .start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 8, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            cursor: pointer;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .start-overlay.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(1.02);
        }

        .start-title {
            font-size: 2.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #fff;
            text-shadow: 0 0 20px rgba(222, 155, 53, 0.5);
            animation: pulse-text 2s infinite ease-in-out;
            text-align: center;
            padding: 0 20px;
        }

        @keyframes pulse-text {
            0%, 100% { opacity: 0.6; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1); }
        }

        /* Переключатель режимов */
        .mode-selector {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            background: rgba(20, 25, 34, 0.85);
            border: 1px solid #2c3545;
            padding: 4px;
            border-radius: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .mode-btn {
            background: transparent;
            border: none;
            color: #64748b;
            padding: 8px 16px;
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mode-btn:hover {
            color: var(--text-color);
        }

        .mode-btn.active {
            background: linear-gradient(135deg, var(--team1-color), #b8781d);
            color: #fff;
            box-shadow: 0 2px 8px rgba(222, 155, 53, 0.3);
        }

        /* Статус-бар */
        .status-panel {
            background: rgba(20, 25, 34, 0.85);
            padding: 12px 40px;
            border-radius: 4px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            font-size: 1.3rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 25px;
            min-width: 400px;
            border: 1px solid #2c3545;
            border-bottom: 4px solid #333;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Кнопка Next Step */
        .next-btn {
            background: #1e2633;
            color: #64748b;
            border: 1px solid #334155;
            padding: 14px 35px;
            font-size: 1.1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-radius: 4px;
            cursor: not-allowed;
            transition: all 0.2s ease;
            margin-bottom: 40px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .next-btn.active {
            background: linear-gradient(135deg, #e11d48, #be123c);
            color: #fff;
            border-color: #f43f5e;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(244, 63, 94, 0.4);
        }

        .next-btn.active:hover {
            transform: scale(1.03);
            filter: brightness(1.1);
        }

        /* Сетка карт */
        .maps-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            width: 100%;
            max-width: 1300px;
            margin-bottom: 30px;
            padding: 10px;
        }

        .map-card {
            position: relative;
            background: var(--card-bg);
            border-radius: 6px;
            overflow: hidden;
            aspect-ratio: 1 / 2; 
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 2px solid rgba(255, 255, 255, 0.08);
            transition: box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .map-card .map-bg {
            width: 100%;
            height: 100%;
            background-size: cover;
            filter: brightness(0.6) contrast(1.1);
            transition: filter 0.3s ease, transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .map-card:hover:not(.disabled) {
            border-color: rgba(222, 155, 53, 0.85); 
            box-shadow: 0 0 25px 6px rgba(222, 155, 53, 0.35), 0 15px 30px rgba(0, 0, 0, 0.7);
        }

        .map-card:hover:not(.disabled) .map-bg {
            transform: scale(1.05); 
            filter: brightness(0.75) contrast(1.15);
        }

        .map-name {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 30px 10px 20px 10px;
            background: linear-gradient(transparent, rgba(0,0,0,0.95) 60%);
            font-size: 1.2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-align: center;
            z-index: 2;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        }

        .map-card.banned {
            cursor: not-allowed;
            border-color: var(--ban-color);
            box-shadow: none;
        }
        .map-card.banned .map-bg {
            filter: brightness(0.1) grayscale(1) !important;
            transform: scale(1) !important;
        }
        .map-card.banned .map-name {
            color: #444;
        }

        .map-card.picked {
            cursor: not-allowed;
            border-color: var(--pick-color);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.15);
        }
        .map-card.picked .map-bg {
            filter: brightness(0.6) contrast(1.1);
            transform: scale(1) !important;
        }

        .map-card.currently-playing {
            border-color: var(--play-color) !important;
            animation: pulse-active-game 1.5s infinite !important;
        }

        .badge {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            padding: 6px 12px;
            border-radius: 3px;
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 1px;
            z-index: 2;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            text-align: center;
            width: 80%;
        }

        .disabled { pointer-events: none; }
        
        @keyframes pulse-active-game {
            0% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.7); filter: brightness(0.9); }
            70% { box-shadow: 0 0 0 15px rgba(244, 63, 94, 0); filter: brightness(1.1); }
            100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.7); filter: brightness(0.9); }
        }

        @media (max-width: 900px) {
            .mode-selector { position: static; margin-bottom: 20px; }
            .status-panel { min-width: 100%; }
        }
    </style>
</head>
<body>

    <div class="start-overlay" id="startOverlay" onclick="startApp()">
        <div class="start-title">Нажмите для начала</div>
    </div>

    <div class="mode-selector">
        <button class="mode-btn active" id="btn-major" onclick="changeMode('major')">Major</button>
        <button class="mode-btn" id="btn-wingman" onclick="changeMode('wingman')">Wingman</button>
    </div>

    <div class="status-panel" id="statusPanel">Загрузка матча...</div>

    <button class="next-btn" id="nextStepBtn" onclick="handleNextStep()">Next Step</button>

    <div class="maps-container" id="mapsGrid"></div>

    <script>
        let audioCtx = null;
        
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function startApp() {
            initAudio(); 
            document.getElementById('startOverlay').classList.add('hidden');
            playSound('next'); 
        }

        function playSound(type) {
            if (type === 'hover' && (!audioCtx || audioCtx.state === 'suspended')) {
                return; 
            }

            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            if (type === 'ban') {
                osc.frequency.setValueAtTime(130, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            } else if (type === 'pick') {
                osc.frequency.setValueAtTime(280, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.18);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.18);
            } else if (type === 'next') {
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'hover') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1200, audioCtx.currentTime); 
                gain.gain.setValueAtTime(0.03, audioCtx.currentTime); 
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05); 
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            }
        }
    </script>

    <script>
        const mapPools = {
            major: [
                { id: 'mirage', name: 'Mirage', img: 'https://images.cybersport.ru/images/og-jpg/plain/b3/b3b4f3a3-4f0d-4e2b-91b8-b968f9de147c.png', pos: 'left center' },
                { id: 'dust2', name: 'Dust II', img: 'https://steamuserimages-a.akamaihd.net/ugc/945097211121617379/F11F1E613998737BDC1F9269D25DA59D104CB7B9/', pos: 'center' },
                { id: 'nuke', name: 'Nuke', img: 'https://bitskins.com/blog/content/images/2024/03/20240328192936_1.jpg', pos: 'center' },
                { id: 'inferno', name: 'Inferno', img: 'https://www.goha.ru/s/E:Bv/mj/bvrOu47FLl.jpg', pos: 'center' },
                { id: 'vertigo', name: 'Vertigo', img: 'https://images.cybersport.ru/images/og-jpg/plain/09/09864af1-e4de-4a7e-b629-37690f3f889c.png', pos: 'center' },
                { id: 'ancient', name: 'Ancient', img: 'https://img-cdn.hltv.org/gallerypicture/2kA0ZlU0R7ogCPLA92nFnH.jpg?auto=compress&ixlib=java-2.1.0&q=75&w=1600&s=efac77bd0ea89b2fccee77ccd5e01413', pos: 'center' },
                { id: 'anubis', name: 'Anubis', img: 'https://images.cybersport.ru/images/og-jpg/plain/5c/5ceb7d4b-8017-4a8b-a1b2-fc2e93deda2f.jpg', pos: 'center' }
            ],
            wingman: [
                { id: 'poseidon', name: 'Poseidon', img: 'https://static.wikia.nocookie.net/cswikia/images/f/f9/De_poseidon.png/revision/latest?cb=20260123171337', pos: 'center' },
                { id: 'sanctum', name: 'Sanctum', img: 'https://static.wikia.nocookie.net/cswikia/images/5/54/De_sanctum.png/revision/latest/scale-to-width-down/1200?cb=20260123171707', pos: 'center' },
                { id: 'overpass', name: 'Overpass', img: 'https://img-cdn.hltv.org/gallerypicture/rv944IgDzBDBWiXNcabgbJ.png?auto=compress&ixlib=java-2.1.0&q=75&w=1600&s=3b93845c73be74f587b94dd32ac45ba9', pos: 'center' },
                { id: 'vertigo', name: 'Vertigo', img: 'https://images.cybersport.ru/images/og-jpg/plain/09/09864af1-e4de-4a7e-b629-37690f3f889c.png', pos: 'center' },
                { id: 'nuke', name: 'Nuke', img: 'https://bitskins.com/blog/content/images/2024/03/20240328192936_1.jpg', pos: 'center' },
                { id: 'inferno', name: 'Inferno', img: 'https://www.goha.ru/s/E:Bv/mj/bvrOu47FLl.jpg', pos: 'center' }
            ]
        };

        let currentMode = 'major';
        let currentPhaseIndex = 0;
        let phases = []; 
        const bannedMaps = new Set();
        let matchOrder = []; 
        let currentPlayStage = 0; 

        const statusPanel = document.getElementById('statusPanel');
        const mapsGrid = document.getElementById('mapsGrid');
        const nextStepBtn = document.getElementById('nextStepBtn');

        function generatePhases(mapCount) {
            const dynamicPhases = [];
            let neededBans = mapCount - 3; 
            if (neededBans < 0) neededBans = 0;

            let turn = 1;
            for (let i = 0; i < neededBans; i++) {
                dynamicPhases.push({
                    team: `Команда ${turn}`,
                    action: 'ban',
                    label: 'ЗАБАНИТЬ КАРТУ'
                });
                turn = turn === 1 ? 2 : 1;
            }

            dynamicPhases.push({ team: 'Команда 1', action: 'pick', label: 'ВЫБРАТЬ СВОЙ ПИК' });
            dynamicPhases.push({ team: 'Команда 2', action: 'pick', label: 'ВЫБРАТЬ СВОЙ ПИК' });

            return dynamicPhases;
        }

        function initMaps() {
            mapsGrid.innerHTML = '';
            const activeMaps = mapPools[currentMode];
            phases = generatePhases(activeMaps.length);

            activeMaps.forEach(map => {
                const card = document.createElement('div');
                card.className = 'map-card';
                card.id = `map-${map.id}`;
                card.innerHTML = `
                    <div class="map-bg" style="background-image: url('${map.img}'); background-position: ${map.pos};"></div>
                    <div class="map-name">${map.name}</div>
                    <div class="badge" id="badge-${map.id}" style="display: none;"></div>
                `;
                
                card.addEventListener('click', () => handleMapClick(map.id));
                card.addEventListener('mouseenter', () => {
                    if (currentPhaseIndex < phases.length && !bannedMaps.has(map.id) && !matchOrder.includes(map.id)) {
                        playSound('hover');
                    }
                });

                mapsGrid.appendChild(card);
            });
            updateStatus();
        }

        function changeMode(mode) {
            if (currentMode === mode) return;
            playSound('next');
            
            currentMode = mode;
            
            document.getElementById('btn-major').classList.toggle('active', mode === 'major');
            document.getElementById('btn-wingman').classList.toggle('active', mode === 'wingman');
            
            currentPhaseIndex = 0;
            bannedMaps.clear();
            matchOrder = [];
            currentPlayStage = 0;
            
            nextStepBtn.classList.remove('active');
            nextStepBtn.innerText = 'Next Step';

            initMaps();
        }

        function updateStatus() {
            const activeMaps = mapPools[currentMode];
            if (currentPhaseIndex < phases.length) {
                const current = phases[currentPhaseIndex];
                statusPanel.innerText = `${current.team}: ${current.label}`;
                statusPanel.style.borderColor = current.team === 'Команда 1' ? 'var(--team1-color)' : 'var(--team2-color)';
            } else if (currentPlayStage === 0) {
                const remaining = activeMaps.filter(m => !bannedMaps.has(m.id) && !matchOrder.includes(m.id));
                
                remaining.forEach(deciderMap => {
                    if (!matchOrder.includes(deciderMap.id)) {
                        matchOrder.push(deciderMap.id);
                        const deciderCard = document.getElementById(`map-${deciderMap.id}`);
                        if (deciderCard) deciderCard.classList.add('disabled');
                        
                        const badge = document.getElementById(`badge-${deciderMap.id}`);
                        if (badge) {
                            badge.style.display = 'block';
                            badge.innerText = 'DECIDER'; // Здесь изменен русский текст на английский
                            badge.style.backgroundColor = 'var(--decider-color)';
                        }
                    }
                });

                statusPanel.innerText = `Драфт завершен. Нажмите "Next Step"`;
                statusPanel.style.borderColor = '#fff';
                nextStepBtn.classList.add('active');
            }
        }

        function handleMapClick(mapId) {
            if (currentPhaseIndex >= phases.length || bannedMaps.has(mapId) || matchOrder.includes(mapId)) return;

            const current = phases[currentPhaseIndex];
            const card = document.getElementById(`map-${mapId}`);
            const badge = document.getElementById(`badge-${mapId}`);

            badge.style.display = 'block';

            if (current.action === 'ban') {
                bannedMaps.add(mapId);
                card.classList.add('banned', 'disabled');
                badge.innerText = 'BANNED';
                badge.style.backgroundColor = 'var(--ban-color)';
                playSound('ban');
            } else if (current.action === 'pick') {
                matchOrder.push(mapId);
                card.classList.add('picked', 'disabled');
                badge.innerText = `PICK`;
                badge.style.backgroundColor = 'var(--pick-color)';
                playSound('pick');
            }

            currentPhaseIndex++;
            updateStatus();
        }

        function handleNextStep() {
            if (currentPhaseIndex < phases.length || currentPlayStage >= matchOrder.length) return;

            playSound('next');
            currentPlayStage++;

            const activeMaps = mapPools[currentMode];
            activeMaps.forEach(m => {
                const card = document.getElementById(`map-${m.id}`);
                if (card) card.classList.remove('currently-playing');
            });

            if (currentPlayStage === 1 && matchOrder[0]) {
                const mapId = matchOrder[0];
                const map = activeMaps.find(m => m.id === mapId);
                document.getElementById(`map-${mapId}`).classList.add('currently-playing');
                statusPanel.innerText = `Играется: Карта 1 — ${map.name} (Пик К1)`;
                statusPanel.style.borderColor = 'var(--play-color)';
            } else if (currentPlayStage === 2 && matchOrder[1]) {
                const mapId = matchOrder[1];
                const map = activeMaps.find(m => m.id === mapId);
                document.getElementById(`map-${mapId}`).classList.add('currently-playing');
                statusPanel.innerText = `Играется: Карта 2 — ${map.name} (Пик К2)`;
                statusPanel.style.borderColor = 'var(--play-color)';
            } else if (currentPlayStage === 3 && matchOrder[2]) {
                const mapId = matchOrder[2];
                const map = activeMaps.find(m => m.id === mapId);
                document.getElementById(`map-${mapId}`).classList.add('currently-playing');
                statusPanel.innerText = `Решающая карта: Decider — ${map.name}`; // Изменено и в статусе для соответствия
                statusPanel.style.borderColor = 'var(--decider-color)';
            }

            if (currentPlayStage === matchOrder.length) {
                nextStepBtn.classList.remove('active');
                nextStepBtn.innerText = 'Матч запущен';
            }
        }

        initMaps();
    </script>
</body>
</html>
