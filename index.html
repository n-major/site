<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NMajor - Хаб</title>
    <meta name="description" content="Любительские турнир-мажоры по знаменитой игре Counter-Strike 2.">
    <style>
        :root {
            /* FACEIT Red Design System Colors */
            --faceit-bg: #1f1f22;
            --faceit-black: #121214;
            --faceit-card: #161618;
            --faceit-border: #2a2a2e;
            --faceit-red: #ff5500; 
            --faceit-text-dark: #6c6c78;
            --faceit-text-muted: #a5a5b4;
            --faceit-text-light: #f5f5f7;
            --faceit-discord: #5865F2;
            --header-height: 60px;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            user-select: none;
            -webkit-user-select: none;
        }
        
        body {
            background-color: var(--faceit-bg);
            color: var(--faceit-text-light);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh; 
            width: 100vw;
            overflow: hidden; 
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* MINIMALISTIC FACEIT HEADER */
        .site-header {
            height: var(--header-height);
            width: 100%;
            background: var(--faceit-black);
            border-bottom: 1px solid var(--faceit-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            position: relative;
            z-index: 50;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-logo-mark {
            width: 4px;
            height: 20px;
            background: var(--faceit-red);
            border-radius: 2px;
        }

        .header-brand {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 900;
            color: var(--faceit-text-light);
        }

        .header-brand span {
            color: var(--faceit-red);
        }

        /* Minimalistic Discord Action Button */
        .btn-discord {
            background: transparent;
            border: 1px solid var(--faceit-border);
            color: var(--faceit-text-light);
            padding: 8px 16px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-discord:hover {
            border-color: var(--faceit-discord);
            background: var(--faceit-discord);
        }

        .btn-discord svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        /* MAIN VIEWS WRAPPER */
        .view-container {
            position: relative;
            flex-grow: 1;
            width: 100%;
            overflow: hidden;
        }

        /* HUB SCREEN ELEMENTS */
        .hub-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            z-index: 10;
            transition: opacity 0.3s ease, transform 0.3s ease;
            opacity: 1;
            transform: scale(1);
        }

        .hub-screen.hidden {
            opacity: 0;
            transform: scale(0.98);
            pointer-events: none;
        }

        .hub-title {
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 800;
            margin-bottom: 6px;
            color: var(--faceit-text-light);
        }

        .hub-subtitle {
            color: var(--faceit-red);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.75rem;
            margin-bottom: 40px;
            font-weight: 700;
        }

        /* HUB VIEWPORT AND VISUAL HINT FADES */
        .hub-viewport-container {
            position: relative;
            width: 100%;
            max-width: 1400px;
            display: flex;
            align-items: center;
        }

        /* Scroll indicator hints built into container styling */
        .hub-viewport-container::before,
        .hub-viewport-container::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            width: 60px;
            pointer-events: none;
            z-index: 25;
            transition: opacity 0.25s ease;
            opacity: 0;
        }

        .hub-viewport-container::before {
            left: 0;
            background: linear-gradient(to right, var(--faceit-bg) 15%, transparent);
        }

        .hub-viewport-container::after {
            right: 0;
            background: linear-gradient(to left, var(--faceit-bg) 15%, transparent);
        }

        /* Toggled via JavaScript depending on actual scroll state values */
        .hub-viewport-container.can-scroll-left::before { opacity: 1; }
        .hub-viewport-container.can-scroll-right::after { opacity: 1; }

        .cards-scroll-wrapper {
            width: 100%;
            overflow-x: auto;
            /* Using auto behavior driven entirely by high frequency scroll intervals for optimal tracking */
            scroll-behavior: auto; 
            display: flex;
            justify-content: flex-start;
            padding: 20px 0;
        }

        /* Hide Scrollbar completely across engines */
        .cards-scroll-wrapper::-webkit-scrollbar {
            display: none;
        }
        .cards-scroll-wrapper {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }

        .cards-container {
            display: flex;
            gap: 20px;
            /* Forces default left-bound sorting layout rule priority mapping */
            margin: 0;
            padding: 0 40px;
            align-items: center;
        }

        /* Flat, Sharp FACEIT Style Card Layout */
        .major-vertical-card {
            background: var(--faceit-card);
            border: 1px solid var(--faceit-border);
            border-radius: 4px;
            width: 260px;
            height: 420px;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            position: relative;
            transition: border-color 0.2s ease, background-color 0.2s ease;
            flex-shrink: 0;
        }

        .major-vertical-card:hover {
            border-color: var(--faceit-red);
            background: var(--faceit-black);
        }

        .card-major-name {
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            color: var(--faceit-text-light);
            text-align: center;
            line-height: 1.4;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-winner-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            margin-bottom: 20px;
            width: 100%;
        }

        .card-winner-logo {
            width: 90px;
            height: 90px;
            object-fit: contain;
            margin-bottom: 16px;
            transition: transform 0.2s ease;
        }

        .card-tbd-logo {
            width: 90px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: 1px dashed var(--faceit-border);
            border-radius: 50%;
            color: var(--faceit-text-dark);
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .major-vertical-card:hover .card-winner-logo {
            transform: scale(1.05);
        }

        .card-winner-name {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--faceit-text-light);
        }

        .card-date-label {
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            color: var(--faceit-text-dark);
            font-weight: 600;
            border-top: 1px solid var(--faceit-border);
            width: 100%;
            text-align: center;
            padding-top: 16px;
        }

        /* BRACKET TOURNAMENT VIEW */
        .bracket-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 30px;
            opacity: 0;
            transform: scale(1.02);
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 5;
        }

        .bracket-screen.active {
            opacity: 1;
            transform: scale(1);
            pointer-events: all;
        }

        .bracket-header-nav {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        .btn-back {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--faceit-card);
            border: 1px solid var(--faceit-border);
            color: var(--faceit-text-muted);
            width: 38px;
            height: 38px;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .btn-back:hover {
            color: var(--faceit-text-light);
            border-color: var(--faceit-text-muted);
            background: var(--faceit-black);
        }

        .title-block {
            text-align: center;
        }

        h1 {
            font-size: 1.6rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 800;
            color: var(--faceit-text-light);
            margin-bottom: 2px;
        }

        .subtitle {
            color: var(--faceit-red);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .tournament-container-relative {
            position: relative;
            flex-grow: 1; 
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #bracket-canvas {
            position: absolute;
            top: 0; left: 0; 
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .tournament-wrapper {
            display: flex;
            align-items: stretch; 
            gap: 70px; 
            position: relative;
            z-index: 2;
            width: 1420px;
            height: 620px; 
            transform-origin: center center;
            transition: transform 0.1s ease-out;
            flex-shrink: 0;
        }

        .round-column {
            display: flex;
            flex-direction: column;
            width: 280px;
            position: relative;
            z-index: 3;
        }

        .round-title {
            text-align: left;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: var(--faceit-text-muted);
            margin-bottom: 15px;
            font-weight: 700;
            border-bottom: 1px solid var(--faceit-border);
            padding-bottom: 8px;
            flex-shrink: 0;
        }

        .match-slot {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex: 1; 
            padding: 8px 0; 
        }

        /* MINIMAL MATCH BOXES */
        .match-box {
            background: var(--faceit-card);
            border: 1px solid var(--faceit-border);
            border-radius: 4px;
            overflow: hidden;
            transition: border-color 0.15s ease, background-color 0.15s ease;
            position: relative;
            height: 110px; 
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .match-box:hover {
            background: var(--faceit-black);
            border-color: var(--faceit-text-dark);
            z-index: 10;
        }

        .match-team {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-left: 14px;
            height: 55px; 
            position: relative;
        }
        
        .match-team:first-child {
            border-bottom: 1px solid var(--faceit-border); 
        }

        .team-details { 
            display: flex; 
            align-items: center; 
            gap: 12px;
            flex-grow: 1;
        }
        
        .team-logo { width: 24px; height: 24px; object-fit: contain; }
        .team-name { font-size: 0.9rem; font-weight: 600; color: var(--faceit-text-light); }
        
        .score-wrapper {
            display: flex;
            align-items: center;
            height: 100%;
            position: relative;
        }

        .team-score {
            font-size: 1rem;
            font-weight: 700;
            background: rgba(0, 0, 0, 0.15);
            height: 55px;
            width: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-left: 1px solid var(--faceit-border);
            color: var(--faceit-text-muted);
        }

        /* SLIDE-OUT MAP DETAILS OVERLAY */
        .match-maps-overlay {
            position: absolute;
            top: 0;
            right: -140px; 
            width: 140px; 
            height: 100%;
            background: var(--faceit-black);
            border-left: 1px solid var(--faceit-red);
            display: flex;
            flex-direction: column;
            justify-content: stretch;
            z-index: 6;
            transition: right 0.2s ease;
        }

        .match-box.finished:hover .match-maps-overlay {
            right: 0;
        }

        .map-round-row {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-bottom: 1px solid var(--faceit-border);
            padding: 4px 6px;
        }
        
        .map-round-row:last-child {
            border-bottom: none;
        }

        .map-bg-banner {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            opacity: 0.08; 
            z-index: 1;
            transition: opacity 0.15s ease;
        }
        
        .map-round-row:hover .map-bg-banner {
            opacity: 0.18; 
        }

        .map-mini-name {
            font-size: 0.65rem;
            text-transform: uppercase;
            font-weight: 600;
            color: #d1d1d6;
            z-index: 5;
            letter-spacing: 0.8px;
            text-align: center;
            margin-top: -2px;
            text-shadow: 0px 1px 4px rgba(0, 0, 0, 0.9);
        }

        .map-row-content {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            width: 100%;
            margin-top: 3px; 
        }

        .map-mini-logo {
            width: 13px;
            height: 13px;
            object-fit: contain;
        }

        .map-score-text {
            color: #ffffff;
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 0.2px;
            white-space: nowrap;
            text-shadow: 0px 1px 3px rgba(0, 0, 0, 0.9);
        }

        .map-demo-download-btn {
            position: absolute;
            top: 2px;
            right: 4px;
            z-index: 3;
            width: 14px;
            height: 14px;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--faceit-text-dark);
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .map-demo-download-btn:hover {
            color: var(--faceit-red);
        }

        .map-demo-download-btn svg {
            width: 9px;
            height: 9px;
            fill: currentColor;
        }

        /* HIGHLIGHTING WINNERS / LOSERS MECHANICS */
        .map-round-row.w1 .map-score-text { color: var(--faceit-red); }
        .map-round-row.w2 .map-score-text { color: var(--faceit-red); }
        .map-round-row.w1 .map-score-text span:last-child { color: #ffffff; }
        .map-round-row.w2 .map-score-text span:first-child { color: #ffffff; }

        .match-box.finished .loser .team-name { color: var(--faceit-text-dark); }
        .match-box.finished .loser .team-logo { opacity: 0.2; filter: grayscale(1); }
        .match-box.finished .winner .team-score { color: var(--faceit-red); font-weight: 800; }
        
        /* Clean minimal indicator border for winner row instead of heavy overlays */
        .match-box.finished .winner::before {
            content: '';
            position: absolute;
            left: 0;
            width: 3px;
            height: 55px;
            background: var(--faceit-red);
        }
        .match-box.finished .winner:nth-child(1)::before { top: 0; }
        .match-box.finished .winner:nth-child(2)::before { bottom: 0; }

        .match-box.upcoming .team-score { color: transparent; }
        .match-box.upcoming .team-score::after { content: '—'; color: var(--faceit-text-dark); position: absolute; }

        /* CHAMPION PRESENTATION BLOCK */
        .champion-column {
            display: flex;
            flex-direction: column;
            justify-content: center; 
            width: 240px;
            position: relative;
            z-index: 3;
        }
        
        .champ-box {
            background: var(--faceit-card);
            border: 1px solid var(--faceit-red);
            padding: 30px 20px;
            border-radius: 4px;
            text-align: center;
            transition: background-color 0.2s ease;
            position: relative;
        }

        .champ-title {
            font-size: 0.75rem;
            color: var(--faceit-red);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            font-weight: 700;
        }

        /* HUB DIVIDERS SYSTEM */
        .card-vertical-divider {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 420px; 
            align-self: center;
            padding: 0 10px; 
            flex-shrink: 0;
        }

        .card-vertical-divider::before,
        .card-vertical-divider::after {
            content: '';
            flex: 1;
            border-left: 1px solid var(--faceit-border); 
        }

        .card-vertical-divider::before { margin-bottom: 12px; }
        .card-vertical-divider::after { margin-top: 12px; }

        .card-vertical-divider span {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--faceit-text-dark);
            writing-mode: vertical-rl; 
            transform: rotate(180deg); 
            white-space: nowrap;
            padding: 4px 0;
        }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="header-left">
            <div class="header-logo-mark"></div>
            <div class="header-brand">N<span>Major</span></div>
        </div>
        <a href="https://discord.gg/zm2UPepfz" target="_blank" class="btn-discord">
            <svg viewBox="0 0 127.14 96.36">
                <path d="M107.7,8.07A105.15,105.15,0,0,0,77.26,0a77.19,77.19,0,0,0-3.3,6.83A96.67,96.67,0,0,0,53.22,6.83,77.19,77.19,0,0,0,49.88,0,105.15,105.15,0,0,0,19.44,8.07C3.66,31.58-1.86,54.65,1,77.53A105.73,105.73,0,0,0,32,96.36a77.7,77.7,0,0,0,6.63-10.85,68.43,68.43,0,0,1-10.43-5c.87-.64,1.72-1.31,2.53-2a75.49,75.49,0,0,0,72.77,0c.81.71,1.66,1.38,2.53,2a68.43,68.43,0,0,1-10.43,5,77.7,77.7,0,0,0,6.63,10.85,105.73,105.73,0,0,0,31-18.83C129.87,49.92,123.82,27.13,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53S36.18,40.36,42.45,40.36,53.83,46,53.83,53,48.72,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.24,60,73.24,53S78.41,40.36,84.69,40.36,96.07,46,96.07,53,91,65.69,84.69,65.69Z"/>
            </svg>
            Подать заявку
        </a>
    </header>

    <div class="view-container">
        <div class="hub-screen" id="hub-view">
            <div class="hub-title">Select Championship</div>
            <div class="hub-subtitle">Champions Stage Hub</div>
            
            <!-- NEW: Modified hint viewport parent box wrapper -->
            <div class="hub-viewport-container" id="hint-wrapper">
                <div class="cards-scroll-wrapper" id="scroll-zone">
                    <div class="cards-container" id="hub-cards-wrapper"></div>
                </div>
            </div>
        </div>

        <div class="bracket-screen" id="bracket-view">
            <div class="bracket-header-nav">
                <button class="btn-back" onclick="backToHub()">←</button>
                <div class="title-block">
                    <h1 id="major-title">Загрузка...</h1>
                    <div class="subtitle">Champions Stage</div>
                </div>
            </div>

            <div class="tournament-container-relative" id="main-container">
                <div class="tournament-wrapper" id="dynamic-bracket">
                    <canvas id="bracket-canvas"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        let mapBanners = {};
        let teamsDatabase = {};
        let majorsDatabase = {};

        async function fetchData() {
            try {
                const response = await fetch("https://gist.githubusercontent.com/n-major/10cdc92d9477615018a5e37069674d29/raw/nmajor.json");
                const json = await response.json();
                
                mapBanners = json["mapBanners"];
                teamsDatabase = json["teams"];
                majorsDatabase = json["majors"];

                initWebsite();
            } catch (error) {
                console.error("Failed to load databases:", error);
            }
        }
        fetchData();

        function getTeam(teamId) {
            const id = teamId ? teamId.toLowerCase().trim() : "tbd";
            if (id === "tbd") {
                return { 
                    content: [], 
                    name: "TBD", 
                    logo: `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236c6c78'><text x='50%' y='65%' font-size='14' font-weight='bold' text-anchor='middle'>?</text></svg>` 
                };
            }
            if (teamsDatabase[id]) {
                if (!teamsDatabase[id].logo) {
                    const letter = teamsDatabase[id].name.charAt(0).toUpperCase();
                    teamsDatabase[id].logo = `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236c6c78'><text x='50%' y='65%' font-size='12' font-weight='bold' text-anchor='middle'>${letter}</text></svg>`;
                }
                return teamsDatabase[id];
            }
            return { content: [], name: "TBD", logo: `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232a2a2e'><text x='50%' y='65%' font-size='14' font-weight='bold' text-anchor='middle'>?</text></svg>` };
        }

        function renderHub() {
            const container = document.getElementById('hub-cards-wrapper');
            container.innerHTML = '';
            Object.keys(majorsDatabase).forEach(id => {
                const major = majorsDatabase[id];
                if (major.divider !== undefined && major.divider !== null) {
                    container.insertAdjacentHTML('beforeend', `<div class="card-vertical-divider">
                        <span>${major.divider}</span>
                    </div>`);
                    return;
                }
                const isTbd = major.winnerId.toLowerCase() === "tbd";
                const winnerTeam = getTeam(major.winnerId);
                let imageOrQuestionHtml = isTbd ? `<div class="card-tbd-logo">?</div>` : `<img src="${winnerTeam.logo}" class="card-winner-logo">`;

                const cardHtml = `
                    <div class="major-vertical-card" onclick="selectMajor('${id}')">
                        <div class="card-major-name">${major.name}</div>
                        <div class="card-winner-zone">
                            ${imageOrQuestionHtml}
                            <div class="card-winner-name" style="${isTbd ? 'color: var(--faceit-text-dark)' : ''}">${winnerTeam.name}</div>
                        </div>
                        <div class="card-date-label">${major.date}</div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHtml);
            });

            // Ensure visual hint properties initialize correctly right after cards load
            setTimeout(evaluateScrollHints, 50);
        }

        function selectMajor(id) {
            document.getElementById('hub-view').classList.add('hidden');
            document.getElementById('bracket-view').classList.add('active');
            window.activeMajorId = id; 
            renderActiveBracket(id);
        }

        function backToHub() {
            window.activeMajorId = null;
            document.getElementById('bracket-view').classList.remove('active');
            document.getElementById('hub-view').classList.remove('hidden');
            // Re-check alignment properties when coming back
            setTimeout(evaluateScrollHints, 50);
        }
        
        function renderActiveBracket(id) {
            const currentMajor = majorsDatabase[id];
            document.getElementById('major-title').innerText = currentMajor.name;

            const wrapper = document.getElementById('dynamic-bracket');
            const canvasHtml = `<canvas id="bracket-canvas"></canvas>`;
            wrapper.innerHTML = canvasHtml; 

            const bracket = currentMajor.bracket;

            bracket.forEach((round) => {
                const roundCol = document.createElement('div');
                roundCol.className = 'round-column';

                const title = document.createElement('div');
                title.className = 'round-title';
                title.innerText = round.roundName;
                roundCol.appendChild(title);

                round.matches.forEach(match => {
                    const team1 = getTeam(match.t1);
                    const team2 = getTeam(match.t2);

                    const isFinished = (match.s1 > 0 || match.s2 > 0) && (match.s1 !== match.s2);
                    const matchStatusClass = isFinished ? 'finished' : 'upcoming';
                    const t1Class = isFinished ? (match.s1 > match.s2 ? 'winner' : 'loser') : '';
                    const t2Class = isFinished ? (match.s2 > match.s1 ? 'winner' : 'loser') : '';

                    let mapsOverlayHtml = '';
                    if (isFinished && match.maps && match.maps.length > 0) {
                        let rowsHtml = '';
                        match.maps.forEach(map => {
                            const mapWinnerClass = map.r1 > map.r2 ? 'w1' : 'w2';
                            const bannerUrl = mapBanners[map.mapCode] || mapBanners["default"];

                            let mapDownloadBtnHtml = '';
                            if (map.demoUrl) {
                                mapDownloadBtnHtml = `
                                    <a class="map-demo-download-btn" href="${map.demoUrl}" download title="Скачать демо ${map.mapCode}">
                                        <svg viewBox="0 0 24 24">
                                            <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/>
                                        </svg>
                                    </a>
                                `;
                            }

                            rowsHtml += `
                                <div class="map-round-row ${mapWinnerClass}">
                                    <img src="${bannerUrl}" class="map-bg-banner">
                                    <div class="map-mini-name">${map.mapCode}</div>
                                    <div class="map-row-content">
                                        <img src="${team1.logo}" class="map-mini-logo">
                                        <span class="map-score-text"><span>${map.r1}</span> - <span>${map.r2}</span></span>
                                        <img src="${team2.logo}" class="map-mini-logo">
                                    </div>
                                    ${mapDownloadBtnHtml}
                                </div>
                            `;
                        });
                        mapsOverlayHtml = `<div class="match-maps-overlay">${rowsHtml}</div>`;
                    }

                    const matchHtml = `
                        <div class="match-slot">
                            <div class="match-box ${matchStatusClass}" id="match-box-${match.id}">

                                ${mapsOverlayHtml}

                                <div class="match-team ${t1Class}">
                                    <div class="team-details">
                                        <img src="${team1.logo}" class="team-logo">
                                        <span class="team-name">${team1.name}</span>
                                    </div>
                                    <div class="score-wrapper">
                                        <div class="team-score">${match.s1}</div>
                                    </div>
                                </div>
                                <div class="match-team ${t2Class}">
                                    <div class="team-details">
                                        <img src="${team2.logo}" class="team-logo">
                                        <span class="team-name">${team2.name}</span>
                                    </div>
                                    <div class="score-wrapper">
                                        <div class="team-score">${match.s2}</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    roundCol.insertAdjacentHTML('beforeend', matchHtml);
                });
                wrapper.appendChild(roundCol);
            });

            const lastRound = bracket[bracket.length - 1];
            const lastMatch = lastRound.matches[lastRound.matches.length - 1];
            const isTournamentOver = (lastMatch.s1 > 0 || lastMatch.s2 > 0) && (lastMatch.s1 !== lastMatch.s2);

            const champCol = document.createElement('div');
            champCol.className = 'champion-column';

            if (isTournamentOver) {
                const winnerId = lastMatch.s1 > lastMatch.s2 ? lastMatch.t1 : lastMatch.t2;
                const winnerTeam = getTeam(winnerId);
                champCol.innerHTML = `
                    <div class="champ-box" id="box-champion">
                        <div class="champ-title">champion</div>
                        <img src="${winnerTeam.logo}" style="width: 70px; height: 70px; object-fit: contain; margin-bottom: 12px;">
                        <div class="team-name" style="font-size: 1.2rem; color: var(--faceit-text-light); font-weight:700;">${winnerTeam.name}</div>
                    </div>
                `;
            } else {
                champCol.innerHTML = `
                    <div class="champ-box" id="box-champion" style="border-color: var(--faceit-border);">
                        <div class="champ-title" style="color: var(--faceit-text-dark);">champion</div>
                        <div style="font-size: 2rem; color: var(--faceit-text-dark); font-weight: 700; margin: 10px 0;">?</div>
                    </div>
                `;
            }
            wrapper.appendChild(champCol);

            scaleBracket();
            requestAnimationFrame(() => drawConnectors(id));
        }

        function scaleBracket() {
            const container = document.getElementById('main-container');
            const wrapper = document.getElementById('dynamic-bracket');
            if(!wrapper) return;
            
            const baseWidth = 1420; 
            const baseHeight = 620;

            let scale = Math.min(container.offsetWidth / baseWidth, container.offsetHeight / baseHeight);
            if (scale > 1) scale = 1;
            
            wrapper.style.transform = `scale(${scale})`;
        }

        function drawConnectors(id) {
            const canvas = document.getElementById('bracket-canvas');
            if (!canvas || !document.getElementById('bracket-view').classList.contains('active')) return;
            
            const ctx = canvas.getContext('2d');
            const wrapper = document.getElementById('dynamic-bracket');
            const currentMajor = majorsDatabase[id];
            
            canvas.width = wrapper.offsetWidth;
            canvas.height = wrapper.offsetHeight;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.lineWidth = 1; 
            ctx.strokeStyle = '#3f3f46'; 
            const borderRadius = 4; 

            const bracket = currentMajor.bracket;
            const wrapperRect = wrapper.getBoundingClientRect();

            for (let r = 0; r < bracket.length; r++) {
                const currentRound = bracket[r];
                const nextRound = bracket[r + 1];

                currentRound.matches.forEach((match, index) => {
                    const isFinished = (match.s1 > 0 || match.s2 > 0) && (match.s1 !== match.s2);
                    if (!isFinished) return; 

                    const matchBox = document.getElementById(`match-box-${match.id}`);
                    if (!matchBox) return;

                    const boxRect = matchBox.getBoundingClientRect();
                    const winnerSlot = match.s1 > match.s2 ? 1 : 2;
                    const currentScale = wrapperRect.width / 1420;

                    const startX = (boxRect.right - wrapperRect.left) / currentScale;
                    const startY = ((boxRect.top - wrapperRect.top) + (winnerSlot === 1 ? boxRect.height * 0.25 : boxRect.height * 0.75)) / currentScale;

                    let endX, endY;

                    if (!nextRound) {
                        const champBox = document.getElementById('box-champion');
                        if (!champBox) return;
                        const champRect = champBox.getBoundingClientRect();
                        
                        endX = (champRect.left - wrapperRect.left) / currentScale;
                        endY = ((champRect.top - wrapperRect.top) + (champRect.height / 2)) / currentScale;
                    } else {
                        const nextMatchIndex = Math.floor(index / 2);
                        const nextMatch = nextRound.matches[nextMatchIndex];
                        const nextMatchBox = document.getElementById(`match-box-${nextMatch.id}`);
                        if (!nextMatchBox) return;
                        
                        const nextBoxRect = nextMatchBox.getBoundingClientRect();
                        const nextTeamSlot = (index % 2 === 0) ? 1 : 2;

                        endX = (nextBoxRect.left - wrapperRect.left) / currentScale;
                        endY = ((nextBoxRect.top - wrapperRect.top) + (nextTeamSlot === 1 ? nextBoxRect.height * 0.25 : nextBoxRect.height * 0.75)) / currentScale;
                    }

                    const midX = startX + (endX - startX) / 2;

                    ctx.beginPath();
                    ctx.moveTo(startX, startY);
                    
                    if (Math.abs(startY - endY) > 10) {
                        const dir = startY < endY ? 1 : -1;
                        ctx.lineTo(midX - borderRadius, startY);
                        ctx.quadraticCurveTo(midX, startY, midX, startY + borderRadius * dir);
                        ctx.lineTo(midX, endY - borderRadius * dir);
                        ctx.quadraticCurveTo(midX, endY, midX + borderRadius, endY);
                    } else {
                        ctx.lineTo(midX, startY);
                        ctx.lineTo(midX, endY);
                    }
                    
                    ctx.lineTo(endX, endY);
                    ctx.stroke();
                });
            }
        }

        /* NEW: Evaluates layout scrolling dimensions to handle mask visibility safely */
        function evaluateScrollHints() {
            const scrollZone = document.getElementById('scroll-zone');
            const hintWrapper = document.getElementById('hint-wrapper');
            if (!scrollZone || !hintWrapper) return;

            const currentScroll = scrollZone.scrollLeft;
            const maxScrollLeft = scrollZone.scrollWidth - scrollZone.clientWidth;

            // Tolerance check handles scaling pixel variance across monitors safely
            if (currentScroll > 2) {
                hintWrapper.classList.add('can-scroll-left');
            } else {
                hintWrapper.classList.remove('can-scroll-left');
            }

            if (currentScroll < maxScrollLeft - 2 && maxScrollLeft > 0) {
                hintWrapper.classList.add('can-scroll-right');
            } else {
                hintWrapper.classList.remove('can-scroll-right');
            }
        }

        function initWebsite() {
            renderHub();

            const scrollZone = document.getElementById('scroll-zone');
            
            // Hardcode reset viewport to leftmost card index boundaries on application mount
            scrollZone.scrollLeft = 0;

            // HIGH-PERFORMANCE SMOOTH TRACKING LOGIC
            let scrollVelocity = 0;
            let activeAnimationId = null;

            function runScrollInertiaFrame() {
                if (Math.abs(scrollVelocity) > 0.1) {
                    scrollZone.scrollBy({ left: scrollVelocity, behavior: 'auto' });
                    scrollVelocity *= 0.82; // Velocity decay rate per frame tick
                    activeAnimationId = requestAnimationFrame(runScrollInertiaFrame);
                } else {
                    scrollVelocity = 0;
                    activeAnimationId = null;
                }
            }

            scrollZone.addEventListener('wheel', (e) => {
                if (e.deltaY !== 0) {
                    e.preventDefault();
                    
                    // Boost scrolling velocity profile dynamically
                    scrollVelocity += e.deltaY * 0.42;
                    
                    // Cap max frame shifting values to avoid display tearing artifacts
                    if (scrollVelocity > 55) scrollVelocity = 55;
                    if (scrollVelocity < -55) scrollVelocity = -55;

                    if (!activeAnimationId) {
                        activeAnimationId = requestAnimationFrame(runScrollInertiaFrame);
                    }
                }
            }, { passive: false });

            // Watch scrolling positions to instantly cycle fade overlay opacity states
            scrollZone.addEventListener('scroll', evaluateScrollHints, { passive: true });

            const resizeObserver = new ResizeObserver(() => {
                evaluateScrollHints();
                if (window.activeMajorId) {
                    scaleBracket();
                    requestAnimationFrame(() => drawConnectors(window.activeMajorId));
                }
            });
            resizeObserver.observe(document.getElementById('main-container'));
            resizeObserver.observe(scrollZone);
        }
    </script>
</body>
