<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NMajor - Хаб</title>
    <meta name="description" content="Любительские турнир-мажоры по знаменитой игре Counter-Strike 2.">
    <style>
        :root {
            --cs2-bg: #12161a;
            --cs2-black: #0c0f12;
            --cs2-card: #1b2228;
            --cs2-card-hover: #232b32;
            --cs2-border: #2d3741;
            --cs2-accent: #de9b35; 
            --cs2-text: #929a9e;
            --cs2-text-light: #ffffff;
            --cs2-loser: #525b62;
            --cs2-discord: #5865F2;
            --header-height: 70px;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            user-select: none;
            -webkit-user-select: none;
        }
        
        body {
            background-color: var(--cs2-bg);
            background-image: linear-gradient(180deg, #161c22 0%, #0d1013 100%);
            color: var(--cs2-text-light);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            height: 100vh; 
            width: 100vw;
            overflow: hidden; 
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* PREMIUM CS2 HEADER SYSTEM */
        .site-header {
            height: var(--header-height);
            width: 100%;
            background: rgba(12, 15, 18, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 2px solid var(--cs2-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            position: relative;
            z-index: 50;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-logo-mark {
            width: 4px;
            height: 24px;
            background: var(--cs2-accent);
            border-radius: 2px;
            box-shadow: 0 0 10px rgba(222, 155, 53, 0.6);
        }

        .header-brand {
            font-size: 1.3rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 900;
            color: var(--cs2-text-light);
        }

        .header-brand span {
            color: var(--cs2-accent);
            text-shadow: 0 0 10px rgba(222, 155, 53, 0.2);
        }

        .btn-discord {
            background: rgba(88, 101, 242, 0.08);
            border: 2px solid var(--cs2-discord);
            color: #fff;
            padding: 10px 20px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 4px 12px rgba(88, 101, 242, 0.15);
        }

        .btn-discord:hover {
            background: var(--cs2-discord);
            box-shadow: 0 0 20px rgba(88, 101, 242, 0.4);
            transform: translateY(-1px);
        }

        .btn-discord svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* VIEW CONTAINER SYSTEM */
        .view-container {
            position: relative;
            flex-grow: 1;
            width: 100%;
            overflow: hidden;
        }

        /* ЭКРАН ВЫБОРА МАЖОРА (HUB) */
        .hub-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            z-index: 10;
            transition: opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1), transform 0.4s ease;
            opacity: 1;
            transform: scale(1);
        }

        .hub-screen.hidden {
            opacity: 0;
            transform: scale(0.97);
            pointer-events: none;
        }

        .hub-title {
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 6px;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(180deg, #fff 0%, var(--cs2-text) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hub-subtitle {
            color: var(--cs2-accent);
            letter-spacing: 8px;
            font-size: 1rem;
            margin-bottom: 30px;
            font-weight: 700;
        }

        /* HUB VIEWPORT AND VISUAL HINT FADES */
        .hub-viewport-container {
            position: relative;
            width: 100%;
            max-width: 1400px;
            display: flex;
            align-items: center;
        }

        .hub-viewport-container::before,
        .hub-viewport-container::after {
            content: '';
            position: absolute;
            top: -20px;
            bottom: -20px;
            width: 80px;
            pointer-events: none;
            z-index: 25;
            transition: opacity 0.3s ease;
            opacity: 0;
        }

        .hub-viewport-container::before {
            left: 0;
            background: linear-gradient(to right, #151b21 20%, transparent);
        }

        .hub-viewport-container::after {
            right: 0;
            background: linear-gradient(to left, #0e1215 20%, transparent);
        }

        .hub-viewport-container.can-scroll-left::before { opacity: 1; }
        .hub-viewport-container.can-scroll-right::after { opacity: 1; }

        .cards-scroll-wrapper {
            width: 100%;
            overflow-x: auto;
            scroll-behavior: auto; 
            display: flex;
            justify-content: flex-start;
            padding: 20px 0;
        }

        .cards-scroll-wrapper::-webkit-scrollbar {
            display: none;
        }
        .cards-scroll-wrapper {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .cards-container {
            display: flex;
            gap: 30px;
            margin: 0;
            padding: 0 40px; 
            align-items: center;
        }

        .major-vertical-card {
            background: linear-gradient(180deg, #1d252d 0%, #13191e 100%);
            border: 2px solid var(--cs2-border);
            border-radius: 12px;
            width: 280px;
            height: 450px;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            flex-shrink: 0;
        }

        .major-vertical-card:hover {
            border-color: var(--cs2-accent);
            transform: translateY(-10px);
            box-shadow: 0 0 30px rgba(222, 155, 53, 0.2);
            background: linear-gradient(180deg, #242e38 0%, #161e24 100%);
        }

        .card-major-name {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 800;
            color: #fff;
            text-align: center;
            line-height: 1.4;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-winner-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            margin-bottom: 40px;
            width: 100%;
        }

        .card-winner-logo {
            width: 110px;
            height: 110px;
            object-fit: contain;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 15px rgba(0,0,0,0.5));
            transition: transform 0.3s ease;
        }

        .card-tbd-logo {
            width: 110px;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(45, 55, 65, 0.3);
            border: 2px dashed rgba(222, 155, 53, 0.4);
            border-radius: 50%;
            color: var(--cs2-accent);
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 15px;
            text-shadow: 0 0 15px rgba(222, 155, 53, 0.6);
            box-shadow: inset 0 0 20px rgba(222, 155, 53, 0.1);
        }

        .major-vertical-card:hover .card-winner-logo {
            transform: scale(1.1);
        }

        .card-winner-name {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 1px;
            color: var(--cs2-accent);
        }

        .card-date-label {
            font-size: 0.8rem;
            letter-spacing: 1px;
            color: var(--cs2-text);
            font-weight: 700;
            border-top: 1px solid rgba(255,255,255,0.05);
            width: 100%;
            text-align: center;
            padding-top: 15px;
        }

        /* ЭКРАН ТУРНИРНОЙ СЕТКИ */
        .bracket-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
            transition: opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1), transform 0.4s ease;
            z-index: 5;
        }

        .bracket-screen.active {
            opacity: 1;
            transform: scale(1);
            pointer-events: all;
        }

        .btn-back {
            position: absolute;
            top: 20px;
            left: 40px;
            background: #1b2228;
            border: 2px solid var(--cs2-border);
            color: var(--cs2-text);
            width: 50px;
            height: 50px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .btn-back:hover {
            color: #fff;
            border-color: var(--cs2-accent);
            background: var(--cs2-card-hover);
            box-shadow: 0 0 15px rgba(222, 155, 53, 0.2);
        }

        h1 {
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 800;
            background: linear-gradient(45deg, #fff, var(--cs2-text));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            flex-shrink: 0;
            margin-bottom: 5px;
            margin-top: 10px;
        }

        .subtitle {
            color: var(--cs2-accent);
            letter-spacing: 6px;
            font-size: 0.9rem;
            margin-bottom: 25px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .tournament-container-relative {
            position: relative;
            flex-grow: 1; 
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #bracket-canvas {
            position: absolute;
            top: 0; left: 0; 
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .tournament-wrapper {
            display: flex;
            align-items: stretch; 
            gap: 100px; 
            position: relative;
            z-index: 2;
            width: 1420px;
            height: 620px; 
            transform-origin: center center;
            transition: transform 0.1s ease-out;
            flex-shrink: 0;
        }

        .round-column {
            display: flex;
            flex-direction: column;
            width: 290px;
            position: relative;
            z-index: 3;
        }

        .round-title {
            text-align: center;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: var(--cs2-text);
            margin-bottom: 10px;
            font-weight: bold;
            border-bottom: 1px solid var(--cs2-border);
            padding-bottom: 5px;
            flex-shrink: 0;
        }

        .match-slot {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex: 1; 
            padding: 10px 0; 
        }

        .match-box {
            background: var(--cs2-card);
            border: 1px solid var(--cs2-border);
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(0,0,0,0.5);
            transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1), background-color 0.2s ease, border-color 0.2s ease;
            position: relative;
            height: 130px; 
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .match-box:hover {
            background: var(--cs2-card-hover);
            border-color: #414f5c;
            transform: scale(1.04);
            z-index: 10;
        }

        .match-team {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-left: 18px;
            height: 64px; 
            position: relative;
        }
        
        .match-team:first-child {
            border-bottom: 2px solid rgba(255,255,255,0.03); 
        }

        .team-details { 
            display: flex; 
            align-items: center; 
            gap: 14px;
            flex-grow: 1;
        }
        
        .team-logo { width: 32px; height: 32px; object-fit: contain; }
        .team-name { font-size: 1rem; font-weight: 700; letter-spacing: 0.5px; }
        
        .score-wrapper {
            display: flex;
            align-items: center;
            height: 100%;
            position: relative;
        }

        .team-score {
            font-size: 1.2rem;
            font-weight: 800;
            background: #14181c;
            height: 64px;
            width: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-left: 1px solid var(--cs2-border);
            color: var(--cs2-text);
        }

        .match-maps-overlay {
            position: absolute;
            top: 0;
            right: -100%; 
            width: 150px; 
            height: 100%;
            background: #111518;
            border-left: 2px solid var(--cs2-accent);
            display: flex;
            flex-direction: column;
            justify-content: stretch;
            z-index: 6;
            transition: right 0.25s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: -5px 0 20px rgba(0,0,0,0.6);
        }

        .match-box.finished:hover .match-maps-overlay {
            right: 0;
        }

        .map-round-row {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 0 8px;
        }
        .map-round-row:last-child {
            border-bottom: none;
        }

        .map-bg-banner {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            opacity: 0.2; 
            z-index: 1;
            transition: opacity 0.2s ease;
        }
        .map-round-row:hover .map-bg-banner {
            opacity: 0.35; 
        }

        .map-row-content {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-size: 0.85rem;
            font-weight: 800;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
            width: 100%;
        }

        .map-mini-logo {
            width: 16px;
            height: 16px;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .map-score-text {
            color: #ffffff;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .map-mini-name {
            position: absolute;
            top: 2px;
            left: 6px;
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--cs2-text);
            z-index: 2;
            opacity: 0.8;
        }

        .map-demo-download-btn {
            position: absolute;
            top: 3px;
            right: 4px;
            z-index: 3;
            width: 18px;
            height: 18px;
            background: rgba(20, 24, 28, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--cs2-text);
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .map-demo-download-btn:hover {
            color: #fff;
            border-color: var(--cs2-accent);
            background: var(--cs2-accent);
            box-shadow: 0 0 8px rgba(222, 155, 53, 0.5);
        }

        .map-demo-download-btn svg {
            width: 10px;
            height: 10px;
            fill: currentColor;
        }

        .map-round-row.w1 .map-score-text { color: var(--cs2-accent); }
        .map-round-row.w2 .map-score-text { color: var(--cs2-accent); }
        .map-round-row.w1 .map-score-text span:last-child { color: #fff; }
        .map-round-row.w2 .map-score-text span:first-child { color: #fff; }

        .match-box.finished .loser .team-name { color: var(--cs2-loser); }
        .match-box.finished .loser .team-logo { opacity: 0.3; filter: grayscale(1); }
        .match-box.finished .winner .team-score { color: var(--cs2-accent); background: #1d2127; }
        
        .match-box.finished .winner::before {
            content: '';
            position: absolute;
            left: 0;
            width: 4px;
            height: 64px;
            background: var(--cs2-accent);
        }
        .match-box.finished .winner:nth-child(1)::before { top: 0; }
        .match-box.finished .winner:nth-child(2)::before { bottom: 0; }

        .match-box.upcoming .team-score { color: transparent; background: #171b1f; }
        .match-box.upcoming .team-score::after { content: '-'; color: var(--cs2-loser); position: absolute; }

        .champion-column {
            display: flex;
            flex-direction: column;
            justify-content: center; 
            width: 250px;
            position: relative;
            z-index: 3;
        }
        
        .champ-box {
            background: linear-gradient(180deg, #2a2215 0%, var(--cs2-card) 100%);
            border: 2px solid var(--cs2-accent);
            padding: 30px 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 0 35px rgba(222, 155, 53, 0.25);
            transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
        }

        .champ-title {
            font-size: 0.85rem;
            color: var(--cs2-accent);
            letter-spacing: 3px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .card-vertical-divider {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 450px; 
            align-self: center;
            padding: 0 15px; 
            flex-shrink: 0;
        }

        .card-vertical-divider::before,
        .card-vertical-divider::after {
            content: '';
            flex: 1;
            border-left: 2px dashed var(--cs2-border); 
            transition: border-color 0.3s ease;
        }

        .card-vertical-divider::before { margin-bottom: 15px; }
        .card-vertical-divider::after { margin-top: 15px; }

        .card-vertical-divider:hover::before,
        .card-vertical-divider:hover::after {
            border-color: var(--cs2-accent);
        }

        .card-vertical-divider span {
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--cs2-text);
            writing-mode: vertical-rl; 
            transform: rotate(180deg); 
            white-space: nowrap;
            padding: 5px 0;
        }

        .match-team-content {
            opacity: 0;
            top: -150%;
            background-color: var(--cs2-card);
            transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
            position: absolute;
        }
        .match-team:hover .match-team-content {
            opacity: 1;
        }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="header-left">
            <div class="header-logo-mark"></div>
            <div class="header-brand">N<span>Major</span></div>
        </div>
        <a href="https://discord.gg/zm2UPepfz" target="_blank" class="btn-discord">
            <svg viewBox="0 0 127.14 96.36">
                <path d="M107.7,8.07A105.15,105.15,0,0,0,77.26,0a77.19,77.19,0,0,0-3.3,6.83A96.67,96.67,0,0,0,53.22,6.83,77.19,77.19,0,0,0,49.88,0,105.15,105.15,0,0,0,19.44,8.07C3.66,31.58-1.86,54.65,1,77.53A105.73,105.73,0,0,0,32,96.36a77.7,77.7,0,0,0,6.63-10.85,68.43,68.43,0,0,1-10.43-5c.87-.64,1.72-1.31,2.53-2a75.49,75.49,0,0,0,72.77,0c.81.71,1.66,1.38,2.53,2a68.43,68.43,0,0,1-10.43,5,77.7,77.7,0,0,0,6.63,10.85,105.73,105.73,0,0,0,31-18.83C129.87,49.92,123.82,27.13,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53S36.18,40.36,42.45,40.36,53.83,46,53.83,53,48.72,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.24,60,73.24,53S78.41,40.36,84.69,40.36,96.07,46,96.07,53,91,65.69,84.69,65.69Z"/>
            </svg>
            Подать заявку
        </a>
    </header>

    <div class="view-container">
        <div class="hub-screen" id="hub-view">
            <div class="hub-title">Select Championship</div>
            <div class="hub-subtitle">Champions Stage Hub</div>
            
            <div class="hub-viewport-container" id="hint-wrapper">
                <div class="cards-scroll-wrapper" id="scroll-zone">
                    <div class="cards-container" id="hub-cards-wrapper"></div>
                </div>
            </div>
        </div>

        <div class="bracket-screen" id="bracket-view">
            <button class="btn-back" onclick="backToHub()">←</button>
            <h1 id="major-title">Загрузка...</h1>
            <div class="subtitle">Champions Stage</div>

            <div class="tournament-container-relative" id="main-container">
                <div class="tournament-wrapper" id="dynamic-bracket">
                    <canvas id="bracket-canvas"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        let mapBanners = {};
        let teamsDatabase = {};
        let majorsDatabase = {};

        async function fetchData() {
            try {
                const response = await fetch("https://gist.githubusercontent.com/n-major/10cdc92d9477615018a5e37069674d29/raw/nmajor.json");
                const json = await response.json();
                
                mapBanners = json["mapBanners"];
                teamsDatabase = json["teams"];
                majorsDatabase = json["majors"];

                initWebsite();
            } catch (error) {
                console.error("Failed to load databases:", error);
            }
        }
        fetchData();

        function getTeam(teamId) {
            const id = teamId ? teamId.toLowerCase().trim() : "tbd";
            if (id === "tbd") {
                return { 
                    content: [], 
                    name: "TBD", 
                    logo: `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23525b62'><text x='50%' y='65%' font-size='14' font-weight='bold' text-anchor='middle'>?</text></svg>` 
                };
            }
            if (teamsDatabase[id]) {
                if (!teamsDatabase[id].logo) {
                    const letter = teamsDatabase[id].name.charAt(0).toUpperCase();
                    teamsDatabase[id].logo = `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23525b62'><text x='50%' y='65%' font-size='12' font-weight='bold' text-anchor='middle'>${letter}</text></svg>`;
                }
                return teamsDatabase[id];
            }
            return { content: [], name: "TBD", logo: `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232d3741'><text x='50%' y='65%' font-size='14' font-weight='bold' text-anchor='middle'>?</text></svg>` };
        }

        function renderHub() {
            const container = document.getElementById('hub-cards-wrapper');
            container.innerHTML = '';
            Object.keys(majorsDatabase).forEach(id => {
                const major = majorsDatabase[id];
                if (major.divider !== undefined && major.divider !== null) {
                    container.insertAdjacentHTML('beforeend', `<div class="card-vertical-divider">
                        <span>${major.divider}</span>
                    </div>`);
                    return;
                }
                const isTbd = major.winnerId.toLowerCase() === "tbd";
                const winnerTeam = getTeam(major.winnerId);
                let imageOrQuestionHtml = isTbd ? `<div class="card-tbd-logo">?</div>` : `<img src="${winnerTeam.logo}" class="card-winner-logo">`;

                const cardHtml = `
                    <div class="major-vertical-card" onclick="selectMajor('${id}')">
                        <div class="card-major-name">${major.name}</div>
                        <div class="card-winner-zone">
                            ${imageOrQuestionHtml}
                            <div class="card-winner-name" style="${isTbd ? 'color: var(--cs2-loser)' : ''}">${winnerTeam.name}</div>
                        </div>
                        <div class="card-date-label">${major.date}</div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHtml);
            });

            setTimeout(evaluateScrollHints, 50);
        }

        function selectMajor(id) {
            document.getElementById('hub-view').classList.add('hidden');
            document.getElementById('bracket-view').classList.add('active');
            window.activeMajorId = id; 
            renderActiveBracket(id);
        }

        function backToHub() {
            window.activeMajorId = null;
            document.getElementById('bracket-view').classList.remove('active');
            document.getElementById('hub-view').classList.remove('hidden');
            setTimeout(evaluateScrollHints, 50);
        }

        function getTeamContent(team) {
            let cont = ``;
            team.content.forEach(member => {
                const memberTitle = member.split(";;")[0];
                const memberLink = member.split(";;")[1];
                cont += `<a class="match-team-member" href="${memberLink}">${memberTitle}</a>`;
            });
            return cont;
        }
        
        function renderActiveBracket(id) {
            const currentMajor = majorsDatabase[id];
            document.getElementById('major-title').innerText = currentMajor.name;

            const wrapper = document.getElementById('dynamic-bracket');
            const canvasHtml = `<canvas id="bracket-canvas"></canvas>`;
            wrapper.innerHTML = canvasHtml; 

            const bracket = currentMajor.bracket;

            bracket.forEach((round) => {
                const roundCol = document.createElement('div');
                roundCol.className = 'round-column';

                const title = document.createElement('div');
                title.className = 'round-title';
                title.innerText = round.roundName;
                roundCol.appendChild(title);

                round.matches.forEach(match => {
                    const team1 = getTeam(match.t1);
                    const team2 = getTeam(match.t2);

                    const isFinished = (match.s1 > 0 || match.s2 > 0) && (match.s1 !== match.s2);
                    const matchStatusClass = isFinished ? 'finished' : 'upcoming';
                    const t1Class = isFinished ? (match.s1 > match.s2 ? 'winner' : 'loser') : '';
                    const t2Class = isFinished ? (match.s2 > match.s1 ? 'winner' : 'loser') : '';

                    let mapsOverlayHtml = '';
                    if (isFinished && match.maps && match.maps.length > 0) {
                        let rowsHtml = '';
                        match.maps.forEach(map => {
                            const mapWinnerClass = map.r1 > map.r2 ? 'w1' : 'w2';
                            const bannerUrl = mapBanners[map.mapCode] || mapBanners["default"];

                            let mapDownloadBtnHtml = '';
                            if (map.demoUrl) {
                                mapDownloadBtnHtml = `
                                    <a class="map-demo-download-btn" href="${map.demoUrl}" download title="Скачать демо ${map.mapCode}">
                                        <svg viewBox="0 0 24 24">
                                            <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/>
                                        </svg>
                                    </a>
                                `;
                            }

                            rowsHtml += `
                                <div class="map-round-row ${mapWinnerClass}">
                                    <img src="${bannerUrl}" class="map-bg-banner">
                                    <div class="map-mini-name">${map.mapCode}</div>
                                    <div class="map-row-content">
                                        <img src="${team1.logo}" class="map-mini-logo">
                                        <span class="map-score-text"><span>${map.r1}</span> - <span>${map.r2}</span></span>
                                        <img src="${team2.logo}" class="map-mini-logo">
                                    </div>
                                    ${mapDownloadBtnHtml}
                                </div>
                            `;
                        });
                        mapsOverlayHtml = `<div class="match-maps-overlay">${rowsHtml}</div>`;
                    }

                    const team1Content = getTeamContent(team1);
                    const team2Content = getTeamContent(team2);

                    const matchHtml = `
                        <div class="match-slot">
                            <div class="match-box ${matchStatusClass}" id="match-box-${match.id}">

                                ${mapsOverlayHtml}
                                <div class="match-team-content">${team1Content}</div>
                                <div class="match-team-content">${team2Content}</div>

                                <div class="match-team ${t1Class}">
                                    <div class="team-details">
                                        <img src="${team1.logo}" class="team-logo">
                                        <span class="team-name">${team1.name}</span>
                                    </div>
                                    <div class="score-wrapper">
                                        <div class="team-score">${match.s1}</div>
                                    </div>
                                </div>
                                <div class="match-team ${t2Class}">
                                    <div class="team-details">
                                        <img src="${team2.logo}" class="team-logo">
                                        <span class="team-name">${team2.name}</span>
                                    </div>
                                    <div class="score-wrapper">
                                        <div class="team-score">${match.s2}</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    roundCol.insertAdjacentHTML('beforeend', matchHtml);
                });
                wrapper.appendChild(roundCol);
            });

            const lastRound = bracket[bracket.length - 1];
            const lastMatch = lastRound.matches[lastRound.matches.length - 1];
            const isTournamentOver = (lastMatch.s1 > 0 || lastMatch.s2 > 0) && (lastMatch.s1 !== lastMatch.s2);

            const champCol = document.createElement('div');
            champCol.className = 'champion-column';

            if (isTournamentOver) {
                const winnerId = lastMatch.s1 > lastMatch.s2 ? lastMatch.t1 : lastMatch.t2;
                const winnerTeam = getTeam(winnerId);
                champCol.innerHTML = `
                    <div class="champ-box" id="box-champion">
                        <div class="champ-title">champion</div>
                        <img src="${winnerTeam.logo}" style="width: 80px; height: 80px; object-fit: contain; margin-bottom: 12px;">
                        <div class="team-name" style="font-size: 1.4rem; color: var(--cs2-accent);">${winnerTeam.name}</div>
                    </div>
                `;
            } else {
                champCol.innerHTML = `
                    <div class="champ-box" id="box-champion" style="border-color: #2d3741; background: #14181c;">
                        <div class="champ-title" style="color: #525b62;">champion</div>
                        <div style="font-size: 2.5rem; color: #2d3741; font-weight: bold; margin: 10px 0;">?</div>
                    </div>
                `;
            }
            wrapper.appendChild(champCol);

            scaleBracket();
            requestAnimationFrame(() => drawConnectors(id));
        }

        function scaleBracket() {
            const container = document.getElementById('main-container');
            const wrapper = document.getElementById('dynamic-bracket');
            if(!wrapper) return;
            
            const baseWidth = 1420; 
            const baseHeight = 620;

            let scale = Math.min(container.offsetWidth / baseWidth, container.offsetHeight / baseHeight);
            if (scale > 1) scale = 1;
            
            wrapper.style.transform = `scale(${scale})`;
        }

        function drawConnectors(id) {
            const canvas = document.getElementById('bracket-canvas');
            if (!canvas || !document.getElementById('bracket-view').classList.contains('active')) return;
            
            const ctx = canvas.getContext('2d');
            const wrapper = document.getElementById('dynamic-bracket');
            const currentMajor = majorsDatabase[id];
            
            canvas.width = wrapper.offsetWidth;
            canvas.height = wrapper.offsetHeight;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.lineWidth = 2;
            ctx.strokeStyle = '#2d3741'; 
            const borderRadius = 6; 

            const bracket = currentMajor.bracket;
            const wrapperRect = wrapper.getBoundingClientRect();

            for (let r = 0; r < bracket.length; r++) {
                const currentRound = bracket[r];
                const nextRound = bracket[r + 1];

                currentRound.matches.forEach((match, index) => {
                    const isFinished = (match.s1 > 0 || match.s2 > 0) && (match.s1 !== match.s2);
                    if (!isFinished) return; 

                    const matchBox = document.getElementById(`match-box-${match.id}`);
                    if (!matchBox) return;

                    const boxRect = matchBox.getBoundingClientRect();
                    const winnerSlot = match.s1 > match.s2 ? 1 : 2;
                    const currentScale = wrapperRect.width / 1420;

                    const startX = (boxRect.right - wrapperRect.left) / currentScale;
                    const startY = ((boxRect.top - wrapperRect.top) + (winnerSlot === 1 ? boxRect.height * 0.25 : boxRect.height * 0.75)) / currentScale;

                    let endX, endY;

                    if (!nextRound) {
                        const champBox = document.getElementById('box-champion');
                        if (!champBox) return;
                        const champRect = champBox.getBoundingClientRect();
                        
                        endX = (champRect.left - wrapperRect.left) / currentScale;
                        endY = ((champRect.top - wrapperRect.top) + (champRect.height / 2)) / currentScale;
                    } else {
                        const nextMatchIndex = Math.floor(index / 2);
                        const nextMatch = nextRound.matches[nextMatchIndex];
                        const nextMatchBox = document.getElementById(`match-box-${nextMatch.id}`);
                        if (!nextMatchBox) return;
                        
                        const nextBoxRect = nextMatchBox.getBoundingClientRect();
                        const nextTeamSlot = (index % 2 === 0) ? 1 : 2;

                        endX = (nextBoxRect.left - wrapperRect.left) / currentScale;
                        endY = ((nextBoxRect.top - wrapperRect.top) + (nextTeamSlot === 1 ? nextBoxRect.height * 0.25 : nextBoxRect.height * 0.75)) / currentScale;
                    }

                    const midX = startX + (endX - startX) / 2;

                    ctx.beginPath();
                    ctx.moveTo(startX, startY);
                    
                    if (Math.abs(startY - endY) > 10) {
                        const dir = startY < endY ? 1 : -1;
                        ctx.lineTo(midX - borderRadius, startY);
                        ctx.quadraticCurveTo(midX, startY, midX, startY + borderRadius * dir);
                        ctx.lineTo(midX, endY - borderRadius * dir);
                        ctx.quadraticCurveTo(midX, endY, midX + borderRadius, endY);
                    } else {
                        ctx.lineTo(midX, startY);
                        ctx.lineTo(midX, endY);
                    }
                    
                    ctx.lineTo(endX, endY);
                    ctx.stroke();
                });
            }
        }

        function evaluateScrollHints() {
            const scrollZone = document.getElementById('scroll-zone');
            const hintWrapper = document.getElementById('hint-wrapper');
            if (!scrollZone || !hintWrapper) return;

            const currentScroll = scrollZone.scrollLeft;
            const maxScrollLeft = scrollZone.scrollWidth - scrollZone.clientWidth;

            if (currentScroll > 2) {
                hintWrapper.classList.add('can-scroll-left');
            } else {
                hintWrapper.classList.remove('can-scroll-left');
            }

            if (currentScroll < maxScrollLeft - 2 && maxScrollLeft > 0) {
                hintWrapper.classList.add('can-scroll-right');
            } else {
                hintWrapper.classList.remove('can-scroll-right');
            }
        }

        function initWebsite() {
            renderHub();

            const scrollZone = document.getElementById('scroll-zone');
            scrollZone.scrollLeft = 0;

            let scrollVelocity = 0;
            let activeAnimationId = null;

            function runScrollInertiaFrame() {
                if (Math.abs(scrollVelocity) > 0.1) {
                    scrollZone.scrollBy({ left: scrollVelocity, behavior: 'auto' });
                    scrollVelocity *= 0.84; 
                    activeAnimationId = requestAnimationFrame(runScrollInertiaFrame);
                } else {
                    scrollVelocity = 0;
                    activeAnimationId = null;
                }
            }

            scrollZone.addEventListener('wheel', (e) => {
                if (e.deltaY !== 0) {
                    e.preventDefault();
                    scrollVelocity += e.deltaY * 0.45;
                    
                    if (scrollVelocity > 55) scrollVelocity = 55;
                    if (scrollVelocity < -55) scrollVelocity = -55;

                    if (!activeAnimationId) {
                        activeAnimationId = requestAnimationFrame(runScrollInertiaFrame);
                    }
                }
            }, { passive: false });

            scrollZone.addEventListener('scroll', evaluateScrollHints, { passive: true });

            const resizeObserver = new ResizeObserver(() => {
                evaluateScrollHints();
                if (window.activeMajorId) {
                    scaleBracket();
                    requestAnimationFrame(() => drawConnectors(window.activeMajorId));
                }
            });
            resizeObserver.observe(document.getElementById('main-container'));
            resizeObserver.observe(scrollZone);
        }
    </script>
</body>
